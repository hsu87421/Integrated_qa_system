# MySQL 配置
[mysql]
host = localhost
user = root
password = 
database = enterprise_qa

# Redis 配置
[redis]
host = localhost
port = 6379
password = 
db = 0

# Milvus 配置
[milvus]
host = localhost
port = 19530
# 记得创建这个表
database_name = enterprise_qa
collection_name = enterprise_policy_kb

# LLM 配置
[llm]
model = qwen-plus
dashscope_api_key = sk
dashscope_base_url = https://dashscope.aliyuncs.com/compatible-mode/v1

# 检索参数配置
[retrieval]
parent_chunk_size = 1200
child_chunk_size = 300
chunk_overlap = 50
retrieval_k = 5
candidate_m = 2

# 日志配置
[logger]
log_file = logs/app.log
# 应用配置
[app]
valid_sources = ["人事制度", "考勤休假", "财务审批", "行政服务", "IT服务"]
customer_service_phone = 请联系对应制度负责人或企业服务台
